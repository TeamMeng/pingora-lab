[package]
name = "pingora-lab"
version = "0.1.0"
edition = "2024"
authors = ["TeamMeng <862915265@qq.com>"]
license = "MIT"

[dependencies]
async-trait = "0.1.92"
env_logger = "0.11.11"
log = "0.4.34"
pingora = { version = "0.9.0", features = ["openssl", "proxy"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
