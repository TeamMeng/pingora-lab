[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# 0.9.0 is the newest pingora release, and pingora-core still pulls in both
# crates; there is no fixed version to move to, so accept the unmaintained
# advisories until upstream drops them.
ignore = [
  # derivative (via pingora-core)
  "RUSTSEC-2024-0388",
  # unsafe-libyaml, via serde_yaml (via pingora-core)
  "RUSTSEC-2024-0449",
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
