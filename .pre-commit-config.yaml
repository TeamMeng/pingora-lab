fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: typos
        name: typos
        description: Check spelling with typos.
        entry: typos
        language: system
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: bash scripts/cargo-hook.sh cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-deny
        name: cargo deny
        description: Check cargo dependencies.
        entry: bash scripts/cargo-hook.sh cargo deny check
        language: system
        files: ^(Cargo\.(toml|lock)|deny\.toml)$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources.
        entry: bash scripts/cargo-hook.sh cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: (\.rs$|Cargo\.(toml|lock)$)
        pass_filenames: false
      - id: cargo-test
        name: cargo nextest
        description: Run unit tests with cargo-nextest.
        entry: bash scripts/cargo-hook.sh cargo nextest run --workspace --all-features
        language: system
        files: (\.rs$|Cargo\.(toml|lock)$)
        pass_filenames: false
